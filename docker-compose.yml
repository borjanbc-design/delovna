services:
  web:
    image: node:22
    cpus: 0.25
    mem_limit: 256m
    command: ["npx", "serve", "-l", "3000", "/app"]
    volumes:
      - .:/app
      - .stack-data/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  db:
    image: postgres:16
    cpus: 0.25
    mem_limit: 256m
    volumes:
      - .stack-data/db:/var/lib/postgresql/data
